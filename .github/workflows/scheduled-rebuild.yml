name: Scheduled site rebuild

# Dispara un rebuild de Netlify una vez al día para que los posts con
# `published` futuro aparezcan automáticamente cuando llega su fecha.
# El filtro real lo hace `isPostPublishable` en src/utils/content-utils.ts
# durante el build.
#
# Setup (ya realizado):
#   1. Netlify → sitio "maquinariaspesadas" → Build hooks →
#      "Scheduled daily rebuild" (branch: main)
#   2. GitHub → Settings → Secrets and variables → Actions →
#      secret `NETLIFY_BUILD_HOOK` con la URL del hook
#
# Nota: GitHub desactiva los cron tras 60 días sin commits en el repo.

on:
  schedule:
    # 11:00 UTC = 6:00 AM Lima/Bogotá/Quito.
    # Un solo rebuild diario publica todos los posts del día (3 por día).
    # ~30 builds/mes × ~4.5 min ≈ 135 min, dentro del plan Free de Netlify.
    - cron: '0 11 * * *'

  # Permite trigger manual desde la pestaña Actions del repo
  workflow_dispatch:

jobs:
  trigger-netlify-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify build hook secret exists
        run: |
          if [ -z "${{ secrets.NETLIFY_BUILD_HOOK }}" ]; then
            echo "::error::NETLIFY_BUILD_HOOK secret not configured."
            echo "Set it at: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: Trigger Netlify build hook
        run: |
          status=$(curl -sS -o /dev/null -w "%{http_code}" -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}")
          echo "Netlify response: HTTP $status"

          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "::error::Build hook failed with status $status"
            exit 1
          fi
          echo "✓ Netlify rebuild triggered successfully"
